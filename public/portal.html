<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Portal · RRE Entries</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="ext/session-guard.js"></script>
  <link rel="stylesheet" href="inv/inv.css">
  <style>
    html, body { margin: 0; height: 100%; font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; background: #f6f7f9; }
    #cp-wait { position: fixed; inset: 0; display: grid; place-items: center; color: #6c757d; font-size: 14px; }
    #cp-err { margin: 40px auto; max-width: 420px; padding: 14px 16px; border-radius: 10px; background: #fdecec; color: #a4262c; font-size: 14px; display: none; text-align: center; }
    #cp-err a { color: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <!-- The customer's view of RRE Entries. There is no separate login here: customers sign in on the one RRE sign-in page
       (Customer option) and arrive here. Anyone who is not a customer is sent back to the application. -->
  <div id="cp-wait">Opening your portal…</div>
  <div id="cp-err" role="alert"></div>
  <script src="vendor/lucide.min.js"></script>
  <script src="ext/auth-bridge.js"></script>
  <script src="inv/portal.js"></script>
  <script>
  (function () {
    'use strict';
    if (window.__RRE_REDIRECTING) return;
    const clearSession = () => { try { localStorage.removeItem('tally_user_session'); sessionStorage.removeItem('rre_alive'); } catch (e) { /* ignore */ } };
    // the portal's "Sign out" and the bridge's "session expired" both call this
    window.startWithFreshLogin = async function () {
      if (window.RREPortal) window.RREPortal.close();
      try { await fetch('/api/auth/logout', { method: 'POST', keepalive: true }); } catch (e) { /* the server may be gone */ }
      clearSession(); window.__RRE_REDIRECTING = true; location.replace('login.html');
    };
    (async function start() {
      try {
        const r = await fetch('/api/auth/me', { cache: 'no-store' });
        if (r.status === 401) { clearSession(); location.replace('login.html?expired=1'); return; }
        const j = await r.json();
        if (!j.success || j.data.user.role !== 'Customer') { location.replace('index.html'); return; }
        if (j.data.must_change_password) { location.replace('login.html?switch=1'); return; }
        const w = document.getElementById('cp-wait'); if (w) w.remove();
        const sg = document.getElementById('rre-sg'); if (sg) sg.remove();
        window.RREPortal.open();
      } catch (e) {
        const sg = document.getElementById('rre-sg'); if (sg) sg.remove();
        const w = document.getElementById('cp-wait'); if (w) w.remove();
        const el = document.getElementById('cp-err'); el.style.display = 'block'; el.innerHTML = 'The RRE Entries server could not be reached. <a href="portal.html">Try again</a>';
      }
    })();
  })();
  </script>
</body>
</html>
