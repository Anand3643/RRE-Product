<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Portal</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="inv/inv.css">
  <style>
    html, body { margin: 0; height: 100%; font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; background: #f6f7f9; }
    #cp-login { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; }
    #cp-login .box { width: 100%; max-width: 380px; background: #fff; border: 1px solid #dee2e7; border-radius: 12px; padding: 26px; box-shadow: 0 4px 12px -2px rgb(16 24 40 / .10); }
    #cp-login h1 { margin: 0 0 4px; font-size: 20px; } #cp-login p { margin: 0 0 18px; color: #6c757d; font-size: 13px; }
    #cp-login label { display: block; font-size: 12px; font-weight: 600; margin: 12px 0 4px; color: #495057; }
    #cp-login input { width: 100%; box-sizing: border-box; padding: 9px 11px; border: 1px solid #ced4da; border-radius: 7px; font: inherit; }
    #cp-login input:focus { outline: 2px solid #08918555; border-color: #089185; }
    #cp-login button { width: 100%; margin-top: 18px; padding: 10px; border: 0; border-radius: 7px; background: #089185; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    #cp-login button:disabled { opacity: .6; cursor: wait; }
    #cp-err { margin-top: 12px; padding: 8px 10px; border-radius: 7px; background: #fdecec; color: #a4262c; font-size: 13px; display: none; }
    #cp-hint { margin-top: 10px; font-size: 11px; color: #6c757d; }
  </style>
</head>
<body>
  <!-- A separate page for customers. Staff use the main application; this page refuses anyone who is not a portal customer. -->
  <div id="cp-login" hidden>
    <form class="box" id="cp-form" autocomplete="off">
      <h1 id="cp-title">Customer Portal</h1>
      <p id="cp-sub">Sign in to see the catalogue, send order requests and view your orders and invoices.</p>
      <div id="cp-fields-signin">
        <label for="cp-user">Login name</label><input id="cp-user" name="username" autocomplete="username">
        <label for="cp-pass">Password</label><input id="cp-pass" name="password" type="password" autocomplete="current-password">
      </div>
      <div id="cp-fields-change" hidden>
        <label for="cp-new">New password</label><input id="cp-new" type="password" autocomplete="new-password">
        <label for="cp-new2">Repeat new password</label><input id="cp-new2" type="password" autocomplete="new-password">
        <div id="cp-hint">At least 10 characters, with letters and numbers. Avoid common words and your login name.</div>
      </div>
      <div id="cp-err" role="alert"></div>
      <button id="cp-go" type="submit">Sign in</button>
    </form>
  </div>
  <script src="vendor/lucide.min.js"></script>
  <script src="ext/auth-bridge.js"></script>
  <script src="inv/portal.js"></script>
  <script>
  (function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const SESSION = 'tally_user_session';
    let pending = null; // the temporary-password session while the customer chooses their own password
    const setSession = (d) => { try { localStorage.setItem(SESSION, JSON.stringify({ user: d.user, permissions: d.permissions, token: d.token })); } catch (e) { /* ignore */ } };
    const clearSession = () => { try { localStorage.removeItem(SESSION); } catch (e) { /* ignore */ } };
    const showErr = (m) => { const e = $('cp-err'); e.textContent = m || ''; e.style.display = m ? 'block' : 'none'; };
    async function post(path, body) {
      const r = await fetch('/api' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.success === false) throw new Error(j.error || 'Request failed (' + r.status + ')');
      return j.data || j;
    }
    function showSignIn(message) {
      if (window.RREPortal) window.RREPortal.close();
      pending = null; clearSession();
      $('cp-title').textContent = 'Customer Portal'; $('cp-sub').textContent = 'Sign in to see the catalogue, send order requests and view your orders and invoices.';
      $('cp-fields-signin').hidden = false; $('cp-fields-change').hidden = true; $('cp-go').textContent = 'Sign in';
      $('cp-pass').value = ''; showErr(message || ''); $('cp-login').hidden = false; setTimeout(() => $('cp-user').focus(), 30);
    }
    function showChange() {
      $('cp-title').textContent = 'Choose a new password'; $('cp-sub').textContent = 'For your security, please choose your own password before you continue.';
      $('cp-fields-signin').hidden = true; $('cp-fields-change').hidden = false; $('cp-go').textContent = 'Save password and continue';
      $('cp-new').value = ''; $('cp-new2').value = ''; showErr(''); setTimeout(() => $('cp-new').focus(), 30);
    }
    function enter() { $('cp-login').hidden = true; window.RREPortal.open(); }
    // the portal's own "Sign out" and the bridge's "session expired" both call this
    window.startWithFreshLogin = () => showSignIn();

    $('cp-form').addEventListener('submit', async (ev) => {
      ev.preventDefault(); showErr(''); const btn = $('cp-go'); btn.disabled = true;
      try {
        if (pending) {
          const a = $('cp-new').value, b = $('cp-new2').value;
          if (a !== b) throw new Error('The two new passwords are not the same.');
          const d = await post('/auth/change-password', { current_password: pending.password, new_password: a });
          setSession(d); pending = null; enter(); return;
        }
        if (!$('cp-user').value.trim() || !$('cp-pass').value) throw new Error('Enter your login name and password.');
        const d = await post('/auth/login', { username: $('cp-user').value.trim(), password: $('cp-pass').value });
        if (!d.user || d.user.role !== 'Customer') { clearSession(); throw new Error('This page is for customers. Staff please use the main RRE Tally application.'); }
        setSession(d);
        if (d.must_change_password) { pending = { password: $('cp-pass').value }; $('cp-pass').value = ''; showChange(); return; }
        enter();
      } catch (e) { showErr(e.message); } finally { btn.disabled = false; }
    });

    // keep a customer signed in on reload; anything else starts at the sign-in form
    (async function start() {
      let s = null; try { s = JSON.parse(localStorage.getItem(SESSION) || 'null'); } catch (e) { /* none */ }
      if (s && s.user && s.user.role === 'Customer' && s.token) {
        try { const r = await fetch('/api/portal/me'); if (r.ok) { enter(); return; } } catch (e) { /* fall through */ }
      }
      showSignIn();
    })();
  })();
  </script>
</body>
</html>
